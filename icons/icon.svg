<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18516a" />
      <stop offset="100%" stop-color="#10243b" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="100%" stop-color="#f5b942" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con esquinas redondeadas -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  
  <!-- Sol -->
  <circle cx="256" cy="200" r="85" fill="url(#sun)" />
  
  <!-- Rayos de sol -->
  <g stroke="#f5b942" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="70" x2="256" y2="40" />
    <line x1="256" y1="330" x2="256" y2="360" />
    <line x1="140" y1="120" x2="118" y2="98" />
    <line x1="372" y1="120" x2="394" y2="98" />
    <line x1="90" y1="200" x2="60" y2="200" />
    <line x1="422" y1="200" x2="452" y2="200" />
    <line x1="165" y1="290" x2="145" y2="310" />
    <line x1="347" y1="290" x2="367" y2="310" />
  </g>
  
  <!-- Panel Solar / Estructura -->
  <g transform="translate(56, 300)">
    <!-- Marco del panel -->
    <polygon points="30,120 370,120 400,10 0,10" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linejoin="round" />
    <polygon points="30,120 370,120 400,10 0,10" fill="#1a3c5a" fill-opacity="0.6" />
    
    <!-- Celdas interiores del panel -->
    <line x1="100" y1="10" x2="92" y2="120" stroke="#93c5fd" stroke-width="4" />
    <line x1="200" y1="10" x2="200" y2="120" stroke="#93c5fd" stroke-width="4" />
    <line x1="300" y1="10" x2="308" y2="120" stroke="#93c5fd" stroke-width="4" />
    
    <line x1="10" y1="47" x2="390" y2="47" stroke="#93c5fd" stroke-width="4" />
    <line x1="20" y1="84" x2="380" y2="84" stroke="#93c5fd" stroke-width="4" />
    
    <!-- Rayo de energía central -->
    <polygon points="220,15 180,75 210,75 185,125 245,60 215,60" fill="#f5b942" stroke="#fff" stroke-width="3" />
  </g>
</svg>